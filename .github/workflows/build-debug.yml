# VPN 5G debug build (fixed-key signing, no release).
#
# Mirrors .github/workflows/build.yml (same SDK/NDK/libhevtun/libv2ray
# steps) but builds the debug variant and uploads the universal debug APK.
# The debug APKs are signed with one fixed keystore from secrets
# (VPN5G_KEYSTORE_*); without those secrets the build falls back to the
# default debug signing.
name: Build VPN 5G debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Restore VPN 5G icons
      run: |
        # push_files cannot carry binary files, so the launcher icons travel
        # as base64 text (vpn5g-icons/) and are decoded here. Upstream
        # adaptive-icon leftovers are removed so the PNG icon is used.
        rm -f V2rayNG/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml V2rayNG/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
        rm -f V2rayNG/app/src/main/res/mipmap-*/ic_launcher_foreground.png
        for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
          for n in ic_launcher ic_launcher_round; do
            base64 -d vpn5g-icons/$d-$n.png.b64 > V2rayNG/app/src/main/res/mipmap-$d/$n.png
          done
        done
        ls -l V2rayNG/app/src/main/res/mipmap-*/ic_launcher*.png

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Restore VPN 5G signing keystore
      env:
        VPN5G_KEYSTORE_BASE64: ${{ secrets.VPN5G_KEYSTORE_BASE64 }}
        VPN5G_KEYSTORE_PASSWORD: ${{ secrets.VPN5G_KEYSTORE_PASSWORD }}
        VPN5G_KEY_ALIAS: ${{ secrets.VPN5G_KEY_ALIAS }}
        VPN5G_KEY_PASSWORD: ${{ secrets.VPN5G_KEY_PASSWORD }}
      run: |
        # One fixed signing key so future versions update in place instead of
        # forcing an uninstall. The keystore is decoded from a secret; its
        # contents are never printed. If the secret is absent this step is a
        # no-op and the build keeps the default debug signing.
        if [ -n "$VPN5G_KEYSTORE_BASE64" ]; then
          echo "$VPN5G_KEYSTORE_BASE64" | base64 -d > V2rayNG/app/vpn5g-debug.keystore
          echo "VPN5G_KEYSTORE_PASSWORD=$VPN5G_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "VPN5G_KEY_ALIAS=$VPN5G_KEY_ALIAS" >> $GITHUB_ENV
          echo "VPN5G_KEY_PASSWORD=$VPN5G_KEY_PASSWORD" >> $GITHUB_ENV
        fi

    - name: Build debug APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleDebug

    - name: Upload universal debug APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: vpn5g-debug-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/debug/*universal*.apk
